name: Lint

# Library, tooling and anything carrying a pinned version (README.md and
# the docs pages: `pnpm run lint` runs the version check).
on:
  push:
    branches: [main]
    paths: &paths
      - 'src/**'
      - 'scripts/**'
      - 'dev/**'
      - 'tsconfig*.json'
      - '*.config.js'
      - '*.config.mjs'
      - '.prettierrc.json'
      - '.prettierignore'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/src/**/*.md'
      - 'docs/src/**/*.svelte'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/lint.yml'
  pull_request:
    branches: [main]
    paths: *paths

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run lint
