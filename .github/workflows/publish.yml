name: Publish

# Publishes to npm through trusted publishing (OIDC): npm trusts this
# workflow file in the `npm` environment, so no token is stored anywhere,
# and the package gets a provenance attestation.
#
# Runs when a GitHub release is published (a draft does not count), or by
# hand for an existing tag, e.g. one released before this workflow existed.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, e.g. v1.3.0
        required: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the version everywhere it is written
        run: |
          pnpm run version:check
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm test
      # prepublishOnly cleans, builds and regenerates custom-elements.json.
      # npm, not pnpm, publishes: it is npm that speaks OIDC to the registry.
      - name: Publish
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then
            npm publish --tag next
          else
            npm publish
          fi
