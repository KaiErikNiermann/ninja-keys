name: Test

# Only library changes run the tests; a docs-only change does not.
on:
  push:
    branches: [main]
    paths: &paths
      - 'src/**'
      - 'tsconfig.json'
      - 'web-test-runner.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths: *paths

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test
