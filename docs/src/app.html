<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <meta
      name="description"
      content="ninja-keys: a keyboard command palette as a web component, with a pluggable search and a field query language."
    />
    <script>
      // Set the theme before the first paint: the stored choice, else the
      // system's. Kept in sync afterwards by lib/theme.svelte.ts.
      (() => {
        let stored = null;
        try {
          stored = localStorage.getItem('theme');
        } catch {}
        const dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
